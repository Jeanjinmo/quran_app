name: quran_app
description: "A mobile Quran audio player built with Flutter."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Networking
  dio: ^5.9.0
  connectivity_plus: ^7.0.0

  # Audio
  just_audio: ^0.10.5

  # Storage
  shared_preferences: ^2.5.3

  # Routing
  go_router: ^16.2.4

  # UI
  shimmer: ^3.0.0
  google_fonts: ^6.3.2

  # i18n
  intl: ^0.20.2

  # Logging
  logger: ^2.6.2
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

# Custom app icon (bonus). Regenerate platform icons with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#672CBC"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
