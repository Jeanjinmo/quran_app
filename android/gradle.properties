org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Kotlin incremental compilation.
# Why: the Flutter pub cache lives on C:\ while this project is on D:\. Kotlin's
# incremental compiler computes a *relative* path between each plugin's .kt
# source (C:\...\Pub\Cache\...) and the project dir (D:\...), which throws
# "different roots" on Windows (two drive letters have no common root), failing
# the build. Disabling incremental compilation avoids that path math. Full
# compiles are slightly slower but reliable here.
kotlin.incremental=false
